<!DOCTYPE html>
<html lang="en">
    <head>

    <body>
        <canvas id="matrix-rain" aria-hidden="true"></canvas>
        <main>
            <section class="card">
                <h1>lambert cs club</h1>

</p>
                <nav aria-label="club links">

                    <a href="/instagram">instagram</a>
                    <a href="mailto:lambertcompusci@gmail.com">email</a>
                </nav>
                <div class="tabs" role="tablist" aria-label="club information">
                    <button class="tab active" id="tab-upcoming" type="button" role="tab" aria-selected="true" aria-controls="panel-upcoming" data-tab="upcoming">upcoming</button>
                    <button class="tab" id="tab-officers" type="button" role="tab" aria-selected="false" aria-controls="panel-officers" data-tab="officers">officers</button>
                </div>
                <div class="divider"></div>
                <div class="panel" id="panel-upcoming" role="tabpanel" aria-labelledby="tab-upcoming">
                    <ul>
                        <li>
                            <span class="col-left">aug 21</span>
                            <span class="col-right">club rush</span>

                        </li>
                        <li>

                            <span class="col-right">hackforsyth 2</span>
                            <a class="action-link" href="https://hackforsyth.com/">rsvp
</a>
                        </li>
                    </ul>
                </div>
                <div class="panel" id="panel-officers" role="tabpanel" aria-labelledby="tab-officers" hidden>
                    <ul>
                        <li>
                            <span class="col-left">president</span>
                            <span class="col-right">
                                <a class="officer-link" href="https://samvid.dev/">samvid konchada </a>
                            </span>
                            <span aria-hidden="true"></span>
                        </li>
                        <li>
                            <span class="col-left">vp</span>
                            <span class="col-right">
                                <a class="officer-link" href="https://github.com/ayushj-18">ayush jaiswal </a>
                            </span>
                            <span aria-hidden="true"></span>
                        </li>
                        <li>
                            <span class="col-left">competition</span>
                            <span class="col-right">teja danturti </span>
                            <span aria-hidden="true"></span>
                        </li>
                        <li>
                            <span class="col-left">events</span>
                            <span class="col-right">
                                <a class="officer-link" href="https://immaturegoat.github.io">octavius szeto </a>
                            </span>
                            <span aria-hidden="true"></span>
                        </li>
                        <li>
                            <span class="col-left">events</span>
                            <span class="col-right">
                                <a class="officer-link" href="https://github.com/NeoRazer504">rishan ramning </a>
                            </span>
                            <span aria-hidden="true"></span>
                        </li>
                        <li>
                            <span class="col-left">officer</span>
                            <span class="col-right">
                                <a class="officer-link" href="https://www.instagram.com/yuehanthe/">yuehan he </a>
                            </span>
                            <span aria-hidden="true"></span>
                        </li>
                    </ul>
                </div>
            </section>
        </main>
        <script type="module">
            const s = document.querySelectorAll(".tab")
              , w = document.querySelectorAll(".panel");
            s.forEach(t => {
                t.addEventListener("click", () => {
                    s.forEach(e => {
                        const l = e === t;
                        e.classList.toggle("active", l),
                        e.setAttribute("aria-selected", String(l))
                    }
                    ),
                    w.forEach(e => {
                        e.hidden = e.id !== `panel-${t.dataset.tab}`
                    }
                    )
                }
                )
            }
            );
            const h = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&"
              , i = document.getElementById("matrix-rain")
              , n = i.getContext("2d")
              , a = 16;
            let r = 0
              , o = []
              , u = []
              , g = 0;
            function M() {
                i.width = window.innerWidth,
                i.height = window.innerHeight,
                r = Math.floor(i.width / a),
                o = Array.from({
                    length: r
                }, () => Math.random() * -50),
                u = Array.from({
                    length: r
                }, () => .3 + Math.random() * .9)
            }
            function d() {
                return h[Math.floor(Math.random() * h.length)]
            }
            function y() {
                n.fillStyle = "#000000",
                n.fillRect(0, 0, i.width, i.height),
                n.font = `${a}px "JetBrains Mono", monospace`;
                for (let t = 0; t < r; t += 1) {
                    const e = Math.floor(o[t]) * a;
                    n.fillStyle = "#ffffff",
                    n.fillText(d(), t * a, e),
                    n.fillStyle = "#cccccc",
                    n.fillText(d(), t * a, e - a),
                    n.fillStyle = "#333333";
                    const l = 6 + Math.floor(Math.random() * 8);
                    for (let c = 2; c < l; c += 1)
                        n.fillText(d(), t * a, e - c * a);
                    o[t] += u[t],
                    o[t] * a > i.height && Math.random() > .975 && (o[t] = Math.random() * -20)
                }
            }
            function f() {
                y(),
                g = requestAnimationFrame(f)
            }
            let m;
            window.addEventListener("resize", () => {
                clearTimeout(m),
                m = setTimeout( () => {
                    cancelAnimationFrame(g),
                    M(),
                    f()
                }
                , 150)
            }
            );
            M();
            f();
        </script>
    </body>
</html>
